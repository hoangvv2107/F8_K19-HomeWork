<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FakeStore</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="logo">
          <i class="fa-solid fa-cart-shopping"></i>
          <span>FakeStore</span>
        </div>

        <form action="" class="search-form">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input
            type="search"
            name="search-input"
            id="search-input"
            class="search-input"
            placeholder="Tim kiem san pham"
          />
        </form>

        <div class="cart-user" id="cart-user">
          <i class="fa-solid fa-cart-shopping cart-header"></i>
          <div class="cart-badge" id="cart-badge" style="display: none"></div>
        </div>
      </div>
    </header>
    <main class="main">
      <div class="container">
        <nav class="products-menu">
          <h2>
            <i class="fa-solid fa-filter"></i>
            Danh muc
          </h2>
          <ul class="product-filter" id="product-filter">
            <li class="product-menu-item product-menu-item__active">
              <a href="#!" class="product-menu-link"> Tat ca san pham </a>
            </li>
          </ul>
        </nav>

        <div class="main-content">
          <h2 class="title">Tat ca san pham</h2>
          <p class="desc">Hien thi san pham</p>
          <div id="products-list"></div>
        </div>
      </div>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
